---
name: Probe pull-requests write token
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
permissions:
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const tries = {
              merge: () => github.rest.pulls.merge({ ...context.repo, pull_number: 6 }),
              updateBranch: () => github.rest.pulls.updateBranch({ ...context.repo, pull_number: 6 }),
              approve: () => github.rest.pulls.createReview({ ...context.repo, pull_number: 6, event: 'APPROVE' }),
              createPR: () => github.rest.pulls.create({ ...context.repo, head: 'open4', base: 'forcepush', title: 'probe' }),
              pushFile: () => github.rest.repos.createOrUpdateFileContents({ ...context.repo, path: 'probe.txt', message: 'probe', content: Buffer.from('x').toString('base64'), branch: 'open3' }),
              rerunWorkflow: () => github.rest.actions.reRunWorkflow({ ...context.repo, run_id: 36219673999 }),
              readSecrets: () => github.rest.actions.listRepoSecrets({ ...context.repo }),
              editBase: () => github.rest.pulls.update({ ...context.repo, pull_number: 7, base: 'forcepush' }),
            };
            for (const [name, fn] of Object.entries(tries)) {
              try { await fn(); core.info(`PROBE ${name}: ALLOWED`); }
              catch (e) { core.info(`PROBE ${name}: DENIED ${e.status} ${e.message.split('\n')[0].slice(0, 120)}`); }
            }
